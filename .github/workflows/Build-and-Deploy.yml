name: Deploy to Cloud Run

on:
  push:
    branches:
      - develop

  workflow_dispatch:
   inputs:
    ENVIRONMENT:
      description: 'ENvironment to deploy to'
      required: true
      type: choice
      options:
        - dev
        - staging
        - prod
      default: 'dev'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set environment variables
        id: set-env
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.ENVIRONMENT }}" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/${{ env.secrets.GCP_PROJECT_ID }}/my-service:latest .
          docker push gcr.io/${{ env.secrets.GCP_PROJECT_ID }}/my-service:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v0
        with:
          service: my-service
          region: us-central1
          image: gcr.io/${{ env.secrets.GCP_PROJECT_ID }}/my-service:latest