name: Deploy to Cloud Run

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set environment variables
        id: set-env
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.ENVIRONMENT }}" >> $GITHUB_ENV
          if [ "${{ github.event.inputs.ENVIRONMENT }}" == "dev" ]; then
            echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID_DEV }}" >> $GITHUB_ENV
            echo "${{ secrets.GCP_CREDENTIALS_DEV }}" > $GITHUB_ENV/GCP_CREDENTIALS.json
          elif [ "${{ github.event.inputs.ENVIRONMENT }}" == "staging" ]; then
            echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID_STAGING }}" >> $GITHUB_ENV
            echo "${{ secrets.GCP_CREDENTIALS_STAGING }}" > $GITHUB_ENV/GCP_CREDENTIALS.json
          elif [ "${{ github.event.inputs.ENVIRONMENT }}" == "prod" ]; then
            echo "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID_PROD }}" >> $GITHUB_ENV
            echo "${{ secrets.GCP_CREDENTIALS_PROD }}" > $GITHUB_ENV/GCP_CREDENTIALS.json
          fi

      - name: Configure Workload Identity Federation
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS }}

      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/${{ env.GCP_PROJECT_ID }}/my-service:latest .
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/my-service:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v0
        with:
          service: my-service
          region: us-central1
          image: gcr.io/${{ env.GCP_PROJECT_ID }}/my-service:latest