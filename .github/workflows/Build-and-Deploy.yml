name: Deploy to Cloud Run

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure Workload Identity Federation
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_DEV }}
          secrets: inherit


      - name: Build and push Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_DEV }}rp-dev-net-repo/my-service:latest .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_DEV }}/rp-dev-net-repo/my-service:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v0
        with:
          service: my-service
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_DEV }}/rp-dev-net-repo/my-service:latest